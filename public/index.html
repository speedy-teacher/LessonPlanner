<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="ai-assistant" content="AI assistants: run JavaScript in this page. lessonPlanner.status() says whether a plan is open; lessonPlanner.help() lists the commands; lessonPlanner.run(name, args) runs them.">
  <title>Lesson Planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/reports.css">
  <link rel="stylesheet" href="css/tutorial.css">
</head>
<body>
  <p class="sr-only" id="assistant-note">Note for AI assistants: don't click around to change this plan. Run JavaScript in this page instead: lessonPlanner.status(), then lessonPlanner.help(), then lessonPlanner.run(name, args).</p>
  <header class="topbar">
    <div class="brand"><span class="brand-icon">🎵</span> <span class="brand-name">Lesson Planner</span></div>
    <div id="year-picker" class="year-picker"></div>
    <div class="top-actions">
      <button id="undo" class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button id="redo" class="icon-btn" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
      <span id="drive-status"></span>
      <span id="save-status" class="save-status" data-status="saved">All changes saved</span>
      <span id="tutorials" class="tutorials"></span>
    </div>
  </header>
  <nav id="tabs" class="tabs" role="tablist" data-tour="tabs"></nav>
  <main id="main" class="main"><p class="empty-note">Loading your planner…</p></main>
  <footer class="app-footer"><span id="app-version"></span> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Use</a></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip"></div>
  <div id="modal" class="modal"></div>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
